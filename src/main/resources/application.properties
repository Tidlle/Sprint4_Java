# =============================================
# Configurações do servidor Quarkus (Render)
# =============================================

# Porta e host (Render injeta automaticamente a variável PORT)
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# =============================================
# CORS – permite chamadas do frontend (Vercel)
# =============================================
quarkus.http.cors=true
quarkus.http.cors.origins=https://hcapp-seven.vercel.app/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,origin,authorization,content-type

# =============================================
# Logs – útil em produção e debug
# =============================================
quarkus.log.level=INFO
quarkus.log.console.level=INFO
