# Porta padrão do servidor
quarkus.http.port=8080

# Habilitar CORS para permitir o acesso do frontend (React)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,origin,authorization,content-type

# Configuração de conexão com o Oracle FIAP
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=rm562259
quarkus.datasource.password=fiap25
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521/orcl
quarkus.datasource.jdbc.driver=oracle.jdbc.OracleDriver

# Pool de conexões
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Aumenta o nível de log para mostrar o stack completo
quarkus.log.level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.category."io.quarkus".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.server.handlers".level=DEBUG